<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Phone outline -->
  <rect x="60" y="20" width="80" height="160" rx="12" ry="12" fill="none" stroke="#2d4a35" stroke-width="2.5"/>
  <!-- Screen top notch/speaker -->
  <line x1="92" y1="28" x2="108" y2="28" stroke="#2d4a35" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Screen bottom line / gesture bar -->
  <line x1="90" y1="172" x2="110" y2="172" stroke="#2d4a35" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Progress Ring/Circle -->
  <circle cx="100" cy="95" r="28" fill="none" stroke="#e8f0e9" stroke-width="3"/>
  <circle cx="100" cy="95" r="28" fill="none" stroke="#2d4a35" stroke-width="3" stroke-dasharray="132 176" stroke-dashoffset="40" stroke-linecap="round"/>
  <!-- Text 2h -->
  <text x="100" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#2d4a35" text-anchor="middle">2h</text>
</svg>
