<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PhonePact — Not another app blocker. A pact with people you trust.</title>
  <desc id="desc">The PhonePact social card, matching the homepage hero: on a paper-coloured ground, the line "You were never supposed to fight the algorithm alone" above the headline "Not another app blocker. A pact with people you trust", the principles Self-directed, Community support and No ads or data selling, and the app's home screen showing 1h 47m on your phone so far today with the first shared check-in at 2h 30m.</desc>

  <!-- SOURCE FILE. assets/social-preview.png is what actually ships (og:image
       and twitter:image point at it, cache-busted with ?v=). Nothing serves
       this SVG. Re-render after editing:

         chrome --headless --disable-gpu --screenshot="social-preview.png" \
                --window-size=1200,630 --virtual-time-budget=10000 \
                "file:///…/render.html"

       where render.html inlines this markup with `html,body{margin:0}`. The
       virtual-time budget matters: without it the screenshot can land before
       the webfonts arrive and the card renders in Georgia and Arial.

       EVERY VALUE HERE IS THE SITE'S OWN. Colours are the :root tokens in
       styles.css; type is Newsreader / Inter / JetBrains Mono at the sizes the
       hero and .phone-ui actually use. The one deliberate departure: the hero
       sets .phone-ui__time to font-weight 300, but the site only loads
       Newsreader 400 and 500, so the browser renders it at 400 — this card uses
       400 to match what people actually see, not what the stylesheet asks for. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    .serif  { font-family: 'Newsreader', Georgia, 'Times New Roman', serif; }
    .sans   { font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif; }
    .mono   { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- --ancient-pearl -->
  <rect width="1200" height="630" fill="#F8F6F0"/>

  <!-- The nav wordmark, top left, where the site puts it. -->
  <text class="serif" x="72" y="96" fill="#2d4a35" font-size="30" letter-spacing="-0.5">PhonePact</text>

  <!-- .hero__tagline — Inter 600, 0.28em tracking, uppercase, --accent-active.
       The hero's first line, verbatim. -->
  <text class="sans" x="72" y="172" fill="#3a6b48" font-size="13" font-weight="600" letter-spacing="3.6">YOU WERE NEVER SUPPOSED TO FIGHT THE ALGORITHM ALONE.</text>

  <!-- .hero__title — Newsreader italic, the site's actual headline. The old card
       ran a different sentence entirely ("Your circle sees the pact you kept"),
       so the page someone landed on did not say the thing that brought them. -->
  <text class="serif" x="72" y="256" fill="#2d4a35" font-size="58" font-style="italic" letter-spacing="-0.6">
    <tspan x="72" dy="0">Not another app blocker.</tspan>
    <tspan x="72" dy="66">A pact with people</tspan>
    <tspan x="72" dy="66">you trust.</tspan>
  </text>

  <!-- .hero__summary — Inter at 0.82 opacity, the hero's own sentence. Without
       it the card's left column ran empty from the headline to the rule, which
       the hero never does. -->
  <!-- y=442, not 428: the headline's last line is "you trust.", and its
       descenders reach to about 403. At 428 the summary sat 25px off them and
       read as one crowded block. -->
  <text class="sans" x="72" y="442" fill="#2d4a35" opacity="0.82" font-size="19">
    <tspan x="72" dy="0">Work together to set your screen time goals. Learn to use</tspan>
    <tspan x="72" dy="30">your phone less without lockouts, streaks, or shame.</tspan>
  </text>

  <!-- .hero__proof — a hairline, then the three principles with accent ticks.
       Replaces the old card's "A pact, not a punishment · no lockouts · shared
       check-ins", which was three claims the hero does not make in that form.
       13px rather than 15: the third principle is "No ads or data selling", and
       at 15 it ran under the phone. Shrinking the type is the right trade —
       cutting it to "No ads" would have quietly dropped the data-selling claim,
       which is the half people actually care about. -->
  <path d="M72 486H720" stroke="#D6D1C5"/>
  <g class="sans" font-size="13" font-weight="500" letter-spacing="0.8">
    <text x="72" y="524" fill="#3a6b48">✓</text>
    <text x="92" y="524" fill="#2d4a35">SELF-DIRECTED</text>
    <text x="240" y="524" fill="#3a6b48">✓</text>
    <text x="260" y="524" fill="#2d4a35">COMMUNITY SUPPORT</text>
    <text x="444" y="524" fill="#3a6b48">✓</text>
    <text x="464" y="524" fill="#2d4a35">NO ADS OR DATA SELLING</text>
  </g>

  <!-- The phone, built to .phone-frame: --deep-green body, 40px radius, the
       SPEAKER PILL the hero uses (square top corners, 14px bottom) rather than
       the notch the old card drew, and the hero's own 2deg tilt. -->
  <g transform="translate(818 62) rotate(2 150 252)">
    <rect width="300" height="504" rx="40" fill="#2d4a35"/>
    <rect x="11" y="11" width="278" height="482" rx="30" fill="#FFFDF8"/>
    <path d="M105 11 H195 V15 A14 14 0 0 1 181 29 H119 A14 14 0 0 1 105 15 Z" fill="#2d4a35"/>

    <!-- .phone-ui__bar -->
    <circle cx="36" cy="52" r="2" fill="#78867b"/>
    <text class="mono" x="45" y="56" fill="#78867b" font-size="9" letter-spacing="1.3">AT HOME</text>
    <text class="mono" x="267" y="56" fill="#78867b" font-size="9" letter-spacing="1.3" text-anchor="end">SUN · 28 JUN</text>
    <path d="M11 68H289" stroke="#D6D1C5"/>

    <!-- .phone-ui__greeting -->
    <text class="mono" x="33" y="116" fill="#2d4a35" font-size="11" letter-spacing="1.8">GOOD EVENING, ALEX</text>

    <!-- .phone-ui__time — the hero number, with its italic muted units. -->
    <text class="serif" x="33" y="200" fill="#2d4a35" font-size="76" letter-spacing="-3.4">1<tspan class="serif" font-size="19" font-style="italic" fill="#78867b" letter-spacing="0" dx="4">h</tspan><tspan dx="12">47</tspan><tspan class="serif" font-size="19" font-style="italic" fill="#78867b" letter-spacing="0" dx="4">m</tspan></text>

    <!-- .phone-ui__copy / .phone-ui__goal. The goal line is the copy vocabulary's
         "shared check-in", not "notification" — see the root CLAUDE.md. -->
    <text class="serif" x="33" y="240" fill="#78867b" font-size="15" font-style="italic">on your phone so far today</text>
    <text class="mono" x="33" y="270" fill="#78867b" font-size="9" letter-spacing="1.1">FIRST SHARED CHECK-IN AT 2H 30M</text>

    <!-- .phone-ui__arc, the hero's own geometry scaled to fit. -->
    <g transform="translate(33 302) scale(0.86)">
      <path d="M 16 116 A 114 114 0 0 1 244 116" fill="none" stroke="#D6D1C5" stroke-width="1.75"/>
      <path d="M 16 116 A 114 114 0 0 1 200.8 26.6" fill="none" stroke="#2d4a35" stroke-width="1.75"/>
      <circle cx="49.4" cy="35.4" r="2.4" fill="#78867b"/>
      <circle cx="130" cy="2" r="2.4" fill="#78867b"/>
      <circle cx="200.8" cy="26.6" r="4" fill="#3a6b48"/>
      <g class="mono" fill="#78867b" font-size="10" letter-spacing="0.5">
        <text x="16" y="134" text-anchor="middle">0</text>
        <text x="130" y="-8" text-anchor="middle">1.3h</text>
        <text x="244" y="134" text-anchor="middle">2.5h</text>
      </g>
    </g>

    <!-- .hero__product-caption, the hero's wording in full. The card labels this
         screen a concept because the hero does and because it is true: a card
         showing an unshipped interface unlabelled would be claiming a product
         that does not exist yet. Set at 8.5 rather than 9 so the whole sentence
         fits — "CONCEPT PREVIEW" alone reads as "a preview of the concept",
         which is not the disclaimer; "INTERFACE IN DEVELOPMENT" is the half that
         does the work, so it is the half that must not be cut. -->
    <text class="mono" x="150" y="464" fill="#78867b" font-size="7.8" letter-spacing="0.85" text-anchor="middle">CONCEPT PREVIEW · INTERFACE IN DEVELOPMENT</text>
  </g>
</svg>
